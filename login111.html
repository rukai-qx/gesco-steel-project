<body style="background-color: rgb(238, 239, 240);">
    <!-- The container class is being used with d flex meaning turning out the class into a
          flex box by using the justify content center the flex box is placed center in the screen and align-items-center min-vh-100 meaning brings
          the flex box to the mid of the screen with atleat 100 in height ) -->

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <!-- the class card has been used a componenet similar to a container and used padding 4 with shadow larg
             and border radius 4 called rounded class and adjusted the width and height -->
        <div class="card p-4 shadow-lg rounded-4" style="width: 400px; height: 400px; background-color: #fdfdfd;">
            <form action="login111.php" method="post" onsubmit="return validateLoginForm()">
                <h1 style="font-family: 'Times New Roman', Times, serif;"><b>
                        <center>Login</center>
                    </b></h1>

                <div class="mb-3"> <!-- Margin Bottom,space between the fields -->
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Jenny@gmail.com"
                        required>
                </div>

                <div class="mb-3"> <!-- Margin Bottom,space between the fields -->
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="password"
                        required>
                </div>

                <div class="text-end mb-3">
                    <a href="forgot.php" style="color: #2178fc; text-decoration: none; font-size: 14px;">Forgot
                        Password?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3"
                    onclick="return validateLoginForm()">Login</button>

                <div class="text-center">
                    <p style="color: white;">Don't have an account? <a href="Register1.html"
                            style="color: #012365;">Register here</a></p>
                </div>

            </form>
        </div>
    </div>

    <!-- Bootstrap JS add inetractive fetures to the webpages -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<script>
    function validateLoginForm() {
        // Get values from input fields
        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;

        // Validate whether the fields are empty
        if (!email || !password) {
            alert("Please fill in all fields.");
            return false; // Prevent form submission
        }

        // Validate whether the email is in the correct format
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; //email format
        if (!emailPattern.test(email)) {
            alert("Please enter a valid email address.");
            return false; // Prevent form submission
        }

        return true; // Allow form submission
    }
</script>
