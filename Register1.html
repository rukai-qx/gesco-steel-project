<html>

<head>
    <title>Register</title>
    <!-- Bootstrap CSS (The pre written style sheet with a lots of classes) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('uploads/registerImg.jpg');
            /* Path to your image */
            background-size: cover;
            /* Make image cover entire page */
            background-repeat: no-repeat;
            /* Don’t repeat the image */
            background-position: center;
            /* Center the image */
            height: 100vh;
            /* Full height of viewport */
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }
    </style>
</head>

<body style="background-color: rgb(238, 239, 240);">

    <!-- The container class is being used with d flex meaning turning out the class into a
          flex box by using the justify content center the flex box is placed center in the screen and align-items-center min-vh-100 meaning brings
          the flex box to the mid of the screen with atleat 100 in height ) -->

    <div class="container  d-flex justify-content-center align-items-center min-vh-100 ">

        <!-- the class card has been used a componenet similar to a container and used padding 4 with shadow larg
             and border radius 4 called rounded class and adjusted the width and height -->
        <div class="card p-4 shadow-lg rounded-4  " style="width: 600px; height: 640px; background-color: #d9d6dd;">
            <form action="registerinsert.php" method="post" onsubmit="return validateForm()">
                <h1 style="font-family: 'Times New Roman', Times, serif;"><b>
                        <center>Register</center>
                    </b></h1>

                <div class="mb-3"> <!-- Margin Bottom,space between the fields -->
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Jenny Joson">
                </div>

                <div class="mb-3"> <!-- Margin Bottom,space between the fields -->
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Jenny@gmail.com">
                </div>

                <div class="mb-3"> <!-- Margin Bottom,space between the fields -->
                    <label class="form-label">Phone</label>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="0776543218">
                </div>

                <div class="mb-3"> <!-- Margin Bottom,space between the fields -->
                    <label class="form-label">Address</label>
                    <input type="text" class="form-control" id="address" name="address"
                        placeholder="Vidhya Mawatha,Colombo 7">
                </div>

                <div class="mb-3"> <!-- Margin Bottom,space between the fields -->
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="password">
                </div>

                <div class="mb-3"> <!-- Margin Bottom,space between the fields -->
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="password">
                </div>

                <button type="submit" class="btn btn-primary w-100">Submit</button>

            </form>
        </div>
    </div>
    <!-- Bootstrap JS add inetractive fetures to the webpages -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<script>
    function validateForm() {

        //Declare the varibles to get the values from the input fields
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let phone = document.getElementById("phone").value;
        let address = document.getElementById("address").value;
        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("confirmPassword").value;

        // Validate whether the fields are empty
        if (!name || !email || !phone || !address || !password || !confirmPassword) {
            alert("Please fill in all fields.");
            return false; // Prevent form submission
        }

        // Validate whether the email is in the correct format
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; //email format
        if (!emailPattern.test(email)) {
            alert("Please enter a valid email address.");
            return false; // Prevent form submission
        }

        const blacklistedDomain = "@gesco.com";
        if (email.toLowerCase().endsWith(blacklistedDomain)) {
            alert("Registration is not allowed for emails ending with " + blacklistedDomain);
            return false; // Prevent form submission
        }

        //Validate the phone length
        if (phone.length < 10) {
            alert("Enter a valid phone number.");
            return false; // Prevent form submission
        }

        //Validate the password length
        if (password.length < 6) {
            alert("Password must be at least 8 characters long.");
            return false; // Prevent form submission
        }

        // Validate whether the password is equal to confirm password

        if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return false; // Prevent form submission
        }

        return true; // Allow form submission
    }  
</script>
